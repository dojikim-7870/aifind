name: Deploy TanStack App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Force Index Entrypoint
        run: |
          mkdir -p .output/public
          echo "aifind.kr" > .output/public/CNAME
          
          if [ -f .output/client/index.html ]; then
            cp .output/client/index.html .output/public/index.html
          elif [ -f ./index.html ]; then
            cp ./index.html .output/public/index.html
          else
            echo "CRITICAL ERROR: index.html missing!"
            exit 1
          fi
          
          cp .output/public/index.html .output/public/404.html
          ls -la .output/public
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
