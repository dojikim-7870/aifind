name: Deploy TanStack App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify prerendered homepage
        run: |
          if [ ! -s .output/public/index.html ]; then
            echo "ERROR: Prerendered homepage .output/public/index.html is missing or empty."
            echo "Refusing to publish a client shell or repository-root index.html."
            exit 1
          fi

          echo "Preserving the prerendered homepage and route files."
          echo "aifind.kr" > .output/public/CNAME
          find .output/public -maxdepth 3 -type f | sort | head -200
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
