name: Deploy TanStack App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare Deployment Artifacts
        run: |
          # 1. 배포 대상 public 폴더 생성
          mkdir -p .output/public
          
          # 2. CNAME 도메인 설정 파일 생성
          echo "aifind.kr" > .output/public/CNAME
          
          # 3. 루트 및 빌드 폴더 내의 index.html을 배포 위치로 복사
          if [ -f ./index.html ]; then
            cp ./index.html .output/public/index.html
          elif [ -f .output/client/index.html ]; then
            cp .output/client/index.html .output/public/index.html
          fi
          
          # 4. SPA 라우팅을 위한 404.html 생성
          if [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi
          
          echo "=== Final deployment directory contents ==="
          ls -la .output/public
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
