name: Deploy TanStack App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure SPA Routing & CNAME
        run: |
          # 1. 빌드 결과물 디렉토리 구조 전체 출력 (디버깅용)
          echo "=== Full build directory structure ==="
          find . -name "*.html"
          
          # 2. 커스텀 도메인 CNAME 파일 생성
          printf "aifind.kr" > .output/public/CNAME
          
          # 3. 만약 index.html이 .output/client 등에 있다면 .output/public으로 복사
          if [ -f .output/client/index.html ]; then
            cp .output/client/index.html .output/public/index.html
          fi
          
          # 4. SPA 라우팅을 위해 index.html을 404.html로 복사
          if [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
          else
            echo "ERROR: index.html not found in public folder!"
            exit 1
          fi
          
          echo "=== Final .output/public files ==="
          ls -la .output/public
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
